name: Bug report
description: Report a reproducible problem with ifx-compat
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, real DSNs, production data or personal paths.
        For security issues, use the private advisory flow described in SECURITY.md.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - ifx (direct CSDK)
        - ifx_pdo (PDO-backed extension)
        - pdo_informix (PDO driver)
        - php_informix (PHP library)
        - documentation
    validations:
      required: true

  - type: input
    id: php
    attributes:
      label: PHP version and build
      description: Include NTS/ZTS and x64/x86, for example "8.5.11 NTS x64".
      placeholder: "8.5.11 NTS x64"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 x64 / Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: informix
    attributes:
      label: Informix CSDK and IDS versions
      placeholder: "CSDK 4.50.FC12, IDS 14.10.FC12"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
      description: Commands and a small PHP snippet. Redact credentials and real DSNs.
      render: php
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result and logs
      description: Include the full error message, but redact secrets.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed credentials, real DSNs and production data.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
